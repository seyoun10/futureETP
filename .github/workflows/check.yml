# 커밋 전 검사(D-038)를 push·PR마다 다시 돌린다. 앱 빌드는 하지 않는다(D-039).
# 의존성 취약점(audit)은 advisory DB에 따라 결과가 바뀌어 로컬 check에 넣지 않고 여기서만 본다(D-129).
# 미뤄 둔 업그레이드의 조건 충족(deps-watch)은 주간 실행에서만 본다(D-130).
name: check

on:
  push:
    branches: [main]
  pull_request:
  # 코드가 바뀌지 않아도 새 취약점 공개·업그레이드 조건 충족을 알도록 매주 월요일 audit·deps-watch만 돈다
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 서버 DB 통합 테스트(*.db.test.ts)용. 운영과 같은 메이저 버전을 쓴다(D-126)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/futureetp_test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # lockfile만 보므로 설치는 하지 않는다. 앱·서버 런타임 의존성의 high 이상만 실패로 본다
      - run: npm audit --omit=dev --audit-level=high

  # 실패(READY·UNKNOWN)하면 GitHub 실패 알림으로 해당 D-xxx를 다시 볼 때임을 안다. push·PR에서는 돌지 않는다
  deps-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run deps:watch -- --strict
