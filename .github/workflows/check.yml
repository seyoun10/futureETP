# 커밋 전 검사(D-038)를 push·PR마다 다시 돌린다. 앱 빌드는 하지 않는다(D-039).
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 서버 DB 통합 테스트(*.db.test.ts)용. 운영과 같은 메이저 버전을 쓴다(D-126)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/futureetp_test
